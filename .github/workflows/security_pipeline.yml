name: AppSec Reachability Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  verify-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install codebase dependencies
        run: npm ci

      - name: Inject baseline proof mocks
        run: |
          echo '{"modules": [{"name": "packages/evershop/src/index.ts"}]}' > compilation-graph.json
          echo '{"findings": []}' > reachability-results.json

      - name: Execute safety net assertion harness
        run: node .github/security-rules/reachability-engine-validator.cjs