name: Dependency vulnerability pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  dependency-vulnerability-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

#      - name: Inject vulnerable dependency
#        run: |
#          npm install music-metadata@11.15.0 dompurify@3.4.15 --save-dev --workspace=@evershop/appsec-test

      - name: Install codebase dependencies
        run: npm ci

      - name: Initialise build environment
        run: |
          mkdir -p config
          echo "module.exports = {};" > config/production.js

      - name: Extract webpack dependency graph
        env:
          DEPENDENCY_GRAPH_PATH: ${{ github.workspace }}/dependency-graph.json
        run: |
          # Runs the native SWC transpiler pass to build localised file distributions
          npm run compile
          
          # Runs the Webpack bundling pass which invokes telemetry hooks
          npm run build:stats
          
          echo ""
          echo "=== Verification check: validating telemetry schema ==="
          if [ ! -f "${{ github.workspace }}/dependency-graph.json" ]; then
            echo "::error::Telemetry file was never created."
            exit 1
          fi
          
          # Read tracking metrics out of the JSON
          FRONTEND_COUNT=$(jq '.frontend | length' ${{ github.workspace }}/dependency-graph.json)
          BACKEND_COUNT=$(jq '.backend | length' ${{ github.workspace }}/dependency-graph.json)
          
          echo ""
          echo "📊 Telemetry summary:"
          echo "  - Frontend tracked files: $FRONTEND_COUNT"
          echo "  - Backend tracked files:  $BACKEND_COUNT"
          
          # Enforce a structural baseline gate to fail the build if telemetry is empty
          if [ "$FRONTEND_COUNT" -eq 0 ] || [ "$BACKEND_COUNT" -eq 0 ]; then
            echo "::error::Telemetry generation failed. One or both graphs are completely empty."
            echo "=== Corrupted file snapshot ==="
            cat ${{ github.workspace }}/dependency-graph.json
            exit 1
          fi
          
          echo "✅ Telemetry graph verified successfully."

      - name: Execute npm audit
        run: npm audit --json > npm-audit.json || true

      - name: Resolve dependency vulnerabilities
        run: node .github/steps/dependency-vulnerability-resolver.mjs

      - name: Evaluate dependency vulnerabilities
        env:
          DEPENDENCY_GRAPH_PATH: ${{ github.workspace }}/dependency-graph.json
        run: node .github/steps/dependency-vulnerability-evaluator.mjs

      - name: Archive pipeline artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appsec-telemetry-diagnostics
          retention-days: 7
          path: |
            ${{ github.workspace }}/dependency-graph.json
            ${{ github.workspace }}/npm-audit.json
            ${{ github.workspace }}/taint-relationships-map.json
            ${{ github.workspace }}/dependency-vulnerabilities.json
            ${{ github.workspace }}/evaluator-results.json