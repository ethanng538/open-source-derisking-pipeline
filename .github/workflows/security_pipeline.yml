name: AppSec Reachability Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  reachability-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Inject vulnerable dependency
        run: |
          npm install @a2ui/web_core@0.9.0 --save-dev --workspace=@evershop/appsec-test --package-lock-only

      - name: Install codebase dependencies
        run: npm ci

      - name: Initialise build environment
        run: |
          mkdir -p config
          echo "module.exports = {};" > config/production.js

      - name: Compile live codebase graph
        env:
          COMPILATION_GRAPH_PATH: ${{ github.workspace }}/compilation-graph.json
        run: |
          # Runs the native SWC transpiler pass to build localised file distributions
          npm run compile
          
          # Runs the Webpack bundling pass which invokes inline telemetry hooks
          npm run build:stats
          
          echo "=== Verification check: validating telemetry schema ==="
          if [ ! -f "${{ github.workspace }}/compilation-graph.json" ]; then
            echo "::error::Telemetry file was never created."
            exit 1
          fi
          
          # Read tracking metrics out of the JSON
          FRONTEND_COUNT=$(jq '.frontend | length' ${{ github.workspace }}/compilation-graph.json)
          BACKEND_COUNT=$(jq '.backend | length' ${{ github.workspace }}/compilation-graph.json)
          
          echo ""
          echo "📊 Telemetry summary:"
          echo "  - Frontend tracked files: $FRONTEND_COUNT"
          echo "  - Backend tracked files:  $BACKEND_COUNT"
          
          # Enforce a structural baseline gate to fail the build if telemetry is empty
          if [ "$FRONTEND_COUNT" -eq 0 ] || [ "$BACKEND_COUNT" -eq 0 ]; then
            echo "::error::Telemetry generation failed. One or both graphs are completely empty."
            echo "=== Corrupted file snapshot ==="
            cat ${{ github.workspace }}/compilation-graph.json
            exit 1
          fi
          
          echo "✅ Telemetry graph verified successfully."

      - name: Execute npm audit
        run: npm audit --json workspace=@evershop/evershop > npm-audit.json || true

      - name: Find vulnerable dependency files
        run: node .github/security-utils/dependency-vulnerability-finder.mjs

      - name: Archive telemetry artefacts & validator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appsec-telemetry-diagnostics
          retention-days: 7
          path: |
            ${{ github.workspace }}/compilation-graph.json
            ${{ github.workspace }}/npm-audit.json
            ${{ github.workspace }}/dependency-vulnerabilities.json